# Diagnóstico manual del acceso a GitHub Models (no produce ni publica nada). Escribe registro/diagnostico/ia.txt
name: diagnostico-ia
on: { workflow_dispatch: {} }
permissions:
  contents: write
  models: read
jobs:
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probar endpoints
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p registro/diagnostico; o=registro/diagnostico/ia.txt; : > $o
          for url in https://models.github.ai/catalog/models https://models.inference.ai.azure.com/models; do
            echo "### GET $url" >> $o
            curl -sS -i -m 30 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$url" | head -c 1500 >> $o; echo >> $o
          done
          for url in https://models.github.ai/inference/chat/completions https://models.inference.ai.azure.com/chat/completions; do
            echo "### POST $url" >> $o
            curl -sS -i -m 60 -X POST "$url" -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Responde solo: hola"}],"max_tokens":5}' | head -c 1500 >> $o; echo >> $o
          done
          sed -i 's/\(Authorization: Bearer \).*/\1***/' $o
          cat $o
      - name: Guardar
        run: |
          git config user.name "dpt-bot" && git config user.email "dpt-bot@users.noreply.github.com"
          git add registro/diagnostico/ia.txt && git commit -m "diagnóstico IA ${{ github.run_id }}" && git pull --rebase -q && git push
