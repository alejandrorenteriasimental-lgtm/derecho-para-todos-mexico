# Ciclo autónomo de Derecho para Todos México. Corre en GitHub Actions; no requiere una conversación abierta.
# Seguridad: sin PUBLICAR=1 y LANZAMIENTO_AUTORIZADO=SI (variables del repositorio) TODO corre en simulación.
# Costo: runner Linux estándar. Repositorio privado: 2,000 min/mes gratis en el plan Free; un ciclo usa ≈6–15 min.
# IA: API de Gemini en nivel gratuito (sin facturación). La IA local (sistema/ia_local.sh) se retiró del ciclo el 26-10-2026.
name: ciclo-produccion
on:
  schedule:
    - cron: "17 9 * * *"      # 03:17 hora de Ciudad de México (UTC-6): redacta de madrugada, cuando Gemini se satura menos; la publicación se programa a las 09:00 y 19:00
    - cron: "17 15 * * *"     # 09:17 CDMX: tercer ciclo (3-11) para el inventario de 90 días; la guardia de minutos (1,850/mes; 150 reservados a publicación) lo detiene si hace falta
    # 5-11: ciclo de las 15:17 CDMX ("17 21 * * *") quitado por la regla de minutos de docs/operacion_autonoma.md (≈190–200 min/día el 3 y 4-11, 571 de 1,850 al 5-11, 26 días por delante). Se repone al completar la reserva o al cambiar de mes.
  workflow_dispatch: {}
concurrency:                  # nunca dos ciclos a la vez
  group: ciclo-produccion
  cancel-in-progress: false
permissions:
  contents: write             # para guardar estado/, registro/ y los guiones redactados en el repositorio
  models: read                # GitHub Models (respaldo): gratuito con límites diarios; sin pago no hay cargos
  actions: read               # para calcular los minutos del mes (guardia del límite gratuito)
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      continuar: ${{ steps.guardia.outputs.continuar }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }      # siempre el estado más reciente (una ejecución en fila no parte de un commit viejo)
      - name: Guardia de minutos gratuitos de Actions (sin dependencias)
        id: guardia
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python3 sistema/metricas_diarias.py --guardia
      - uses: actions/setup-python@v5
        if: steps.guardia.outputs.continuar == 'true'
        with: { python-version: "3.12", cache: pip }
      - name: ffmpeg estático (caché)
        if: steps.guardia.outputs.continuar == 'true'
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-btbn-v1
      - name: Dependencias del sistema
        if: steps.guardia.outputs.continuar == 'true'
        timeout-minutes: 12
        run: bash sistema/apt.sh
      - name: Dependencias de Python
        if: steps.guardia.outputs.continuar == 'true'
        run: pip install -q -r requirements.txt pytest fpdf2
      - name: Pruebas (sin red, sin costo)
        if: steps.guardia.outputs.continuar == 'true'
        run: |
          python -m pytest -q -rf --tb=line pruebas -m "not vivo" --junitxml=/tmp/junit.xml || {
            # cada prueba fallida queda como anotación de GitHub (consultable por la API aunque no se puedan bajar los registros)
            python -c "import xml.etree.ElementTree as E;[print(f'::error title={c.get(\"classname\")}.{c.get(\"name\")}::'+((c.find('failure') if c.find('failure') is not None else c.find('error')).get('message') or '')[:400].replace(chr(10),' ')) for c in E.parse('/tmp/junit.xml').iter('testcase') if c.find('failure') is not None or c.find('error') is not None]"
            exit 1; }
      - name: Pruebas en vivo (fuentes oficiales y modelos)
        if: github.event_name == 'schedule' && steps.guardia.outputs.continuar == 'true'   # solo en la ejecución diaria (ahorra minutos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}             # nivel gratuito de Gemini; sin facturación
        run: |
          mkdir -p registro/pruebas
          python -m pytest -q -rA --tb=short --junitxml=registro/pruebas/junit_vivo.xml pruebas -m vivo 2>&1 | tee registro/pruebas/vivo.txt
        continue-on-error: true   # si un portal oficial está caído no se detiene el sistema; las piezas quedan RETENIDAS
      - name: Guardar resultado de pruebas en vivo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-vivo-${{ github.run_id }}
          path: registro/pruebas/          # solo el reporte: copiar registro/*.json* pisaba las métricas del ciclo al traerlo de vuelta
          if-no-files-found: ignore
  ciclo:
    needs: pruebas            # si una prueba falla, no se produce ni se publica nada
    if: needs.pruebas.outputs.continuar == 'true'     # tope propio de minutos del mes alcanzado: no se ejecuta
    runs-on: ubuntu-latest
    timeout-minutes: 75       # 16-11: +15 por la versión larga de TikTok (solo desde el 1-12)
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }      # siempre el estado más reciente (una ejecución en fila no parte de un commit viejo)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: ffmpeg estático (caché)
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-btbn-v1
      - name: Dependencias
        timeout-minutes: 14
        run: |
          bash sistema/apt.sh
          pip install -q -r requirements.txt
      - name: Modelos de voz (caché)
        uses: actions/cache@v4
        with:
          path: models
          key: modelos-v0.2-kokoro1.0-piper-claude
      - name: Descargar modelos si faltan (GitHub Releases, sin costo)
        run: bash sistema/descargar_modelos.sh
      - name: Copias de respaldo de fuentes oficiales (caché, máx. 7 días de uso)
        uses: actions/cache@v4
        with:
          path: cache_fuentes
          key: fuentes-${{ github.run_id }}
          restore-keys: fuentes-
      - name: Verificar tesis en el Semanario Judicial (sin IA; no detiene el ciclo)
        continue-on-error: true
        timeout-minutes: 3
        run: python sistema/tesis.py
      - name: Marca de inicio (consumo)
        run: date -u +%s > /tmp/inicio
      - name: Ciclo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}                   # respaldo: GitHub Models (models: read)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}               # redacción y auditoría (nivel gratuito, sin facturación)
          PUBLICAR: ${{ vars.PUBLICAR }}                              # "1" solo tras la autorización de lanzamiento
          LANZAMIENTO_AUTORIZADO: ${{ vars.LANZAMIENTO_AUTORIZADO }}  # "SI" solo por decisión expresa del responsable
          TOPE_MXN_MES: ${{ vars.TOPE_MXN_MES }}                      # vacío = 0 MXN
          REDACCIONES_POR_FORMATO: "2"                                # 3-11: inventario de 90 días
          PRODUCCIONES_POR_FORMATO: "2"
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_SYSTEM_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}                 # bot de revisión (el chat se vincula con código; ver sistema/revision.py)
        run: python sistema/ciclo.py
      - name: Versión larga solo para TikTok (16-11; empieza sola en TIKTOK_LARGO_DESDE de data/lanzamiento.json)
        if: always()
        continue-on-error: true      # una falla aquí nunca detiene el ciclo ni el guardado del estado
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}                   # respaldo en el release privado
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}               # nivel gratuito, sin facturación
          TIKTOK_LARGO_POR_CICLO: "2"                                 # las más próximas a publicarse primero
          TIKTOK_LARGO_PRESUPUESTO_S: "900"                           # no empieza otra después de 15 min
        run: python sistema/tiktok_largo.py producir
      - name: Conservar piezas producidas (14 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piezas-${{ github.run_id }}
          path: |
            piezas/*/salida/*_final.mp4
            piezas/*/salida/*_final.srt
            piezas/*/salida/*.png
            piezas/*/salida/*.json
            piezas/*/salida/*_copy.txt
          retention-days: 14
          if-no-files-found: ignore
      - name: Diagnóstico de fuentes rechazadas (texto oficial del artículo)
        if: always()
        run: python sistema/diagnostico.py || true
      - name: Traer el reporte de pruebas en vivo
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: pruebas-vivo-${{ github.run_id }}
          path: registro/pruebas/
        continue-on-error: true
      - name: Registrar consumo real del ciclo
        if: always()
        run: |
          mkdir -p registro
          python - <<'PY'
          import json, os, time, shutil
          ini = int(open('/tmp/inicio').read()) if os.path.exists('/tmp/inicio') else int(time.time()); seg = int(time.time()) - ini
          du = shutil.disk_usage('.'); tam = sum(os.path.getsize(os.path.join(r, f)) for r, _, fs in os.walk('piezas') for f in fs)
          ev = {"ts": time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), "run": os.environ.get('GITHUB_RUN_ID'), "segundos_ciclo": seg,
                "minutos_facturables_estimados": -(-seg // 60), "bytes_piezas": tam, "runner": os.environ.get('RUNNER_OS'), "costo_mxn": 0}
          open('registro/consumo.jsonl', 'a').write(json.dumps(ev) + '\n'); print(ev)
          PY
      - name: Métricas diarias (solo lectura de registros)
        if: always()
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python sistema/metricas_diarias.py || true
      - name: Registro de avance de la primera etapa (90 + 90)
        if: always()
        run: python sistema/avance.py || true
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "dpt-bot" && git config user.email "dpt-bot@users.noreply.github.com"
          git add estado registro piezas/*/guion.json piezas/*/salida/*.json data/calendario_lanzamiento.json || true
          git diff --cached --quiet || (git commit -m "ciclo ${{ github.run_id }}" && git pull --rebase -q && git push)
