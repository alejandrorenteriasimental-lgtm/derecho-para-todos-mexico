# Revisión humana por Telegram: recoge los botones Aprobar/Rechazar, aplica las decisiones a la versión exacta revisada
# y envía las piezas pendientes. Ligero (solo Python estándar, ≈1 min). Comparte el grupo de concurrencia del ciclo:
# nunca corre al mismo tiempo que una producción. Sin TELEGRAM_TOKEN no hace nada.
name: revision
on:
  schedule:
    - cron: "41 */4 * * *"     # cada 4 horas (Telegram conserva los botones pendientes 24 h)
  workflow_dispatch: {}
concurrency:
  group: ciclo-produccion
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Recoger y aplicar decisiones; enviar pendientes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then echo "Bot de Telegram sin configurar; nada que hacer."; exit 0; fi
          python sistema/revision.py
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "dpt-bot" && git config user.email "dpt-bot@users.noreply.github.com"
          git add estado || true
          git diff --cached --quiet || (git commit -m "revision ${{ github.run_id }}" && git pull --rebase -q && git push)
